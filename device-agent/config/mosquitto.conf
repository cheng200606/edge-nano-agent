# Device Agent 本地 MQTT Broker 配置（mosquitto 2.1.4）
#
# 为什么项目自带一份配置、且用 1884 而不是 1883：
#   1. mosquitto 2.x 默认「只监听回环 + 禁止匿名」，用项目配置才能保证可复现；
#   2. 安装器会把 mosquitto 注册成 Windows 服务（SYSTEM 身份）并占用
#      127.0.0.1:1883。停止该服务需要管理员（UAC）权限，本项目不依赖它，
#      因此改用一个独立端口，绕开冲突、也不需要提权。
#
# 启动：
#   D:\dsh\bianyuan\mosquitto\mosquitto.exe -c config\mosquitto.conf -v
#   或： powershell -File scripts\mqtt-broker.ps1 start

# 独立端口，避开系统服务的 1883
listener 1884 0.0.0.0

# 开发期允许匿名；M6 的安全要求（S-01）会在演示前切到 password_file
allow_anonymous true

# 不落盘，避免测试数据污染
persistence false

# 日志：全部类型，方便排查
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# 连接超时与保活上限
max_keepalive 300
